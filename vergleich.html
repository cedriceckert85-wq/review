<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vergleich">
<title>Wer performt besser? — Alle Depots vs. Benchmark</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --card2: #1c2330; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e;
    --teal: #39d2c0; --blue: #58a6ff; --purple: #bc8cff; --gold: #e3b341;
    --spy: #ffffff; --geld: #3fb950;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    padding: calc(24px + env(safe-area-inset-top, 0px))
             calc(16px + env(safe-area-inset-right, 0px))
             calc(40px + env(safe-area-inset-bottom, 0px))
             calc(16px + env(safe-area-inset-left, 0px));
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 18px; }
  .sub a { color: var(--blue); text-decoration: none; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  canvas { width: 100%; height: 380px; display: block; }

  .rangliste { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .r-item {
    flex: 1; min-width: 130px; background: var(--card2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; border-top: 3px solid var(--c, var(--border));
  }
  .r-item .platz { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .r-item .name { font-weight: 700; font-size: 0.88rem; }
  .r-item .wert { font-size: 1.25rem; font-weight: 800; }
  .pos { color: var(--geld); } .neg { color: #f85149; }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 22px; }
  @media (max-width: 500px) {
    body { padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
    h1 { font-size: 1.25rem; }
    canvas { height: 300px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Wer performt besser?</h1>
  <p class="sub">
    Alle 4 Agenten gegen S&amp;P 500 und 2 % Tagesgeld — Rendite in % seit 12.06.2026, täglich nach US-Börsenschluss.
    <a href="index.html">← Reviews</a> ·
    <a href="schatten.html">Schatten</a> ·
    <a href="woche.html">Woche</a> ·
    <a href="https://cedriceckert85-wq.github.io/swing/" target="_blank">Swing</a>
  </p>

  <div class="card">
    <canvas id="chart"></canvas>
    <div class="rangliste" id="rangliste"></div>
  </div>

  <footer id="hinweis">Paper-/Journal-Performance · Keine Anlageberatung</footer>
</div>

<script>
const SERIEN = [
  { key: "schatten",  name: "Schatten (Reviewer)", farbe: "#39d2c0", breite: 2.5, dash: [] },
  { key: "swing",     name: "◆ Swing-Agent",       farbe: "#e3b341", breite: 2.5, dash: [] },
  { key: "haupt",     name: "Haupt-Depot",          farbe: "#58a6ff", breite: 2,   dash: [] },
  { key: "speku",     name: "Speku-Depot",          farbe: "#bc8cff", breite: 2,   dash: [] },
  { key: "spy",       name: "S&P 500 (SPY)",        farbe: "#ffffff", breite: 1.5, dash: [6, 4] },
  { key: "tagesgeld", name: "Tagesgeld 2 %",        farbe: "#3fb950", breite: 1.5, dash: [2, 4] }
];
const fmtP = v => (v > 0 ? "+" : "") + v.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " %";
let daten = [];

function zeichnen() {
  const cv = document.getElementById("chart");
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight || 380;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  if (!daten.length) return;

  const alle = daten.flatMap(p => SERIEN.map(s => p[s.key]).filter(v => v != null));
  let min = Math.min(...alle, 0), max = Math.max(...alle, 0);
  const span = Math.max(max - min, 0.5);
  min -= span * 0.12; max += span * 0.12;

  const padL = 48, padR = 14, padT = 14, padB = 28;
  const x = i => daten.length === 1 ? (padL + (W - padL - padR) / 2) : padL + (W - padL - padR) * i / (daten.length - 1);
  const y = v => padT + (H - padT - padB) * (1 - (v - min) / (max - min));

  ctx.font = "11px sans-serif";
  for (let i = 0; i <= 5; i++) {
    const v = min + (max - min) * i / 5;
    ctx.strokeStyle = "#21262d"; ctx.beginPath();
    ctx.moveTo(padL, y(v)); ctx.lineTo(W - padR, y(v)); ctx.stroke();
    ctx.fillStyle = "#8b949e"; ctx.textAlign = "right";
    ctx.fillText(v.toFixed(1) + "%", padL - 6, y(v) + 4);
  }
  ctx.strokeStyle = "#484f58"; ctx.setLineDash([4, 4]); ctx.beginPath();
  ctx.moveTo(padL, y(0)); ctx.lineTo(W - padR, y(0)); ctx.stroke(); ctx.setLineDash([]);

  const step = Math.max(1, Math.ceil(daten.length / 9));
  ctx.fillStyle = "#8b949e"; ctx.textAlign = "center";
  daten.forEach((p, i) => {
    if (i % step === 0 || i === daten.length - 1) ctx.fillText(p.label, x(i), H - 8);
  });

  SERIEN.forEach(s => {
    ctx.strokeStyle = s.farbe; ctx.lineWidth = s.breite; ctx.setLineDash(s.dash);
    ctx.beginPath();
    let begonnen = false;
    daten.forEach((p, i) => {
      if (p[s.key] == null) return;
      if (!begonnen) { ctx.moveTo(x(i), y(p[s.key])); begonnen = true; }
      else ctx.lineTo(x(i), y(p[s.key]));
    });
    ctx.stroke(); ctx.setLineDash([]);
    daten.forEach((p, i) => {
      if (p[s.key] == null) return;
      ctx.fillStyle = s.farbe; ctx.beginPath();
      ctx.arc(x(i), y(p[s.key]), s.breite + 0.5, 0, Math.PI * 2); ctx.fill();
    });
  });
}

function laden() {
  fetch("data/vergleich.json?_=" + Date.now()).then(r => r.json()).then(d => {
    daten = d.verlauf;
    document.getElementById("hinweis").textContent = d.meta.hinweis + " · Keine Anlageberatung";
    if (!daten.length) {
      document.getElementById("rangliste").innerHTML =
        '<div class="empty" style="width:100%">Erste Daten heute Abend nach US-Börsenschluss (~22:21 Uhr).</div>';
      return;
    }
    const letzte = daten[daten.length - 1];
    const sortiert = [...SERIEN].sort((a, b) => (letzte[b.key] ?? -999) - (letzte[a.key] ?? -999));
    document.getElementById("rangliste").innerHTML = sortiert.map((s, i) => `
      <div class="r-item" style="--c:${s.farbe}">
        <div class="platz">Platz ${i + 1}</div>
        <div class="name">${s.name}</div>
        <div class="wert ${letzte[s.key] >= 0 ? "pos" : "neg"}">${letzte[s.key] == null ? "—" : fmtP(letzte[s.key])}</div>
      </div>`).join("");
    zeichnen();
  }).catch(() => {
    document.getElementById("rangliste").innerHTML = '<div class="empty" style="width:100%">Daten nicht ladbar.</div>';
  });
}
laden();
setInterval(laden, 5 * 60 * 1000);
let rt;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(zeichnen, 150); });
window.addEventListener("orientationchange", () => setTimeout(zeichnen, 300));
</script>
</body>
</html>
