<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>🌍 Meine Reise-Weltkarte</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1/dist/css/jsvectormap.min.css">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --txt:#e8eaed; --muted:#9aa0aa; --accent:#22c55e; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:14px 16px 8px; text-align:center; }
  h1 { margin:0; font-size:1.25rem; }
  #stats { margin-top:6px; font-size:1rem; color:var(--muted); }
  #stats b { color:var(--accent); font-size:1.15rem; }
  #map { width:100%; height:70vh; background:var(--panel); border-radius:12px; }
  .wrap { padding:0 12px; }
  footer { display:flex; gap:10px; align-items:center; justify-content:center;
    flex-wrap:wrap; padding:12px; color:var(--muted); font-size:.85rem; }
  button { background:var(--panel); color:var(--txt); border:1px solid #2a2f3a;
    padding:9px 14px; border-radius:9px; font-size:.9rem; cursor:pointer; }
  button:active { background:#222633; }
  .hint { flex:1 1 100%; text-align:center; }
</style>
</head>
<body>
  <header>
    <h1>🌍 Meine Reise-Weltkarte</h1>
    <div id="stats">Lade Karte…</div>
  </header>
  <div class="wrap"><div id="map"></div></div>
  <footer>
    <span class="hint">Tippe ein Land an = <b style="color:var(--accent)">besucht</b> · nochmal tippen = entfernen · zoomen mit + / − oder Wischen</span>
    <button id="reset">Alle zurücksetzen</button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jsvectormap@1/dist/jsvectormap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsvectormap@1/dist/maps/world.js"></script>
  <script>
    var KEY = "weltkarte_besucht_v1";
    var TOTAL = 195; // grobe Zahl souveräner Staaten für die %-Anzeige
    function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; } }
    function save(arr){ localStorage.setItem(KEY, JSON.stringify(arr)); }
    function updateStats(n){
      var pct = Math.round(n / TOTAL * 100);
      document.getElementById("stats").innerHTML =
        "<b>" + n + "</b> Länder besucht · " + pct + "% der Welt";
    }

    var visited = load();
    updateStats(visited.length);

    var map = new jsVectorMap({
      selector: "#map",
      map: "world",
      zoomButtons: true,
      backgroundColor: "transparent",
      regionsSelectable: true,
      selectedRegions: visited,
      regionStyle: {
        initial: { fill: "#3a3f4b", stroke: "#0f1115", strokeWidth: 0.4 },
        hover:   { fill: "#5a93d4" },
        selected:{ fill: "#22c55e" }
      },
      onRegionSelected: function () {
        var sel;
        try { sel = map.getSelectedRegions(); } catch(e) { sel = visited; }
        if (!Array.isArray(sel)) sel = Object.keys(sel || {});
        visited = sel;
        save(visited);
        updateStats(visited.length);
      }
    });

    document.getElementById("reset").addEventListener("click", function () {
      if (!confirm("Wirklich ALLE Markierungen löschen?")) return;
      visited = [];
      save(visited);
      // ausgewählte Regionen in der Karte leeren und neu laden ist am robustesten:
      location.reload();
    });
  </script>
</body>
</html>
