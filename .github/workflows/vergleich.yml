name: Performance-Vergleich

on:
  schedule:
    # Mo-Fr 20:21 UTC = 22:21 Berlin (Sommer) — nach US-Boersenschluss.
    - cron: '21 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vergleich
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vergleichsdaten sammeln
        env:
          ALPACA_SWING_KEY: ${{ secrets.ALPACA_SWING_KEY }}
          ALPACA_SWING_SECRET: ${{ secrets.ALPACA_SWING_SECRET }}
          ALPACA_SPEKU_KEY: ${{ secrets.ALPACA_SPEKU_KEY }}
          ALPACA_SPEKU_SECRET: ${{ secrets.ALPACA_SPEKU_SECRET }}
          ALPACA_HAUPT_KEY: ${{ secrets.ALPACA_HAUPT_KEY }}
          ALPACA_HAUPT_SECRET: ${{ secrets.ALPACA_HAUPT_SECRET }}
        run: python scripts/vergleich_update.py
      - name: Commit & Push (nur bei Änderung)
        run: |
          if git diff --quiet data/vergleich.json; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name "vergleich-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/vergleich.json
          git commit -m "Vergleich $(TZ=Europe/Berlin date +%d.%m.%Y)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
