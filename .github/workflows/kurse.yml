name: Kurs-Update Schatten-Depot

on:
  schedule:
    # Alle 15 Min während US-Marktzeiten (13-20 UTC = 15:30-22:00 Berlin im Sommer), Mo-Fr.
    # Minuten 7/22/37/52: versetzt zu den Review-Läufen (17:00/22:00) gegen Push-Kollisionen.
    - cron: '7,22,37,52 13-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kurs-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kurse aktualisieren
        run: python scripts/update_kurse.py
      - name: Live-Punkt (Alpaca-Equities)
        env:
          ALPACA_SWING_KEY: ${{ secrets.ALPACA_SWING_KEY }}
          ALPACA_SWING_SECRET: ${{ secrets.ALPACA_SWING_SECRET }}
          ALPACA_SPEKU_KEY: ${{ secrets.ALPACA_SPEKU_KEY }}
          ALPACA_SPEKU_SECRET: ${{ secrets.ALPACA_SPEKU_SECRET }}
          ALPACA_HAUPT_KEY: ${{ secrets.ALPACA_HAUPT_KEY }}
          ALPACA_HAUPT_SECRET: ${{ secrets.ALPACA_HAUPT_SECRET }}
          ALPACA_SOLID_KEY: ${{ secrets.ALPACA_SOLID_KEY }}
          ALPACA_SOLID_SECRET: ${{ secrets.ALPACA_SOLID_SECRET }}
          ALPACA_RISK_KEY: ${{ secrets.ALPACA_RISK_KEY }}
          ALPACA_RISK_SECRET: ${{ secrets.ALPACA_RISK_SECRET }}
        run: python scripts/live_update.py
      - name: Commit & Push (nur bei Änderung)
        run: |
          git add data/schatten.json data/live.json
          if git diff --cached --quiet; then
            echo "Keine Änderung — kein Commit."
            exit 0
          fi
          git config user.name "kurs-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Kurse $(TZ=Europe/Berlin date +%H:%M) Uhr"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
