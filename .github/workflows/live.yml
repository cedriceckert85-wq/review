name: Live-Punkt

on:
  schedule:
    # Alle 5 Min während US-Marktzeiten (Actions-Minimum), versetzt zu :00.
    - cron: '3-58/5 13-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-punkt
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Live-Equities holen
        env:
          ALPACA_SWING_KEY: ${{ secrets.ALPACA_SWING_KEY }}
          ALPACA_SWING_SECRET: ${{ secrets.ALPACA_SWING_SECRET }}
          ALPACA_SPEKU_KEY: ${{ secrets.ALPACA_SPEKU_KEY }}
          ALPACA_SPEKU_SECRET: ${{ secrets.ALPACA_SPEKU_SECRET }}
          ALPACA_HAUPT_KEY: ${{ secrets.ALPACA_HAUPT_KEY }}
          ALPACA_HAUPT_SECRET: ${{ secrets.ALPACA_HAUPT_SECRET }}
          ALPACA_SOLID_KEY: ${{ secrets.ALPACA_SOLID_KEY }}
          ALPACA_SOLID_SECRET: ${{ secrets.ALPACA_SOLID_SECRET }}
          ALPACA_RISK_KEY: ${{ secrets.ALPACA_RISK_KEY }}
          ALPACA_RISK_SECRET: ${{ secrets.ALPACA_RISK_SECRET }}
        run: python scripts/live_update.py
      - name: Commit & Push
        run: |
          git add data/live.json
          if git diff --cached --quiet; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name "live-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Live $(TZ=Europe/Berlin date +%H:%M)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
