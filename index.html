<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EPMT Review">
<title>EPMT Review — Tägliche Experten-Bewertung</title>
<style>
  :root {
    --bg: #000000;
    --card: #1c1c1e;
    --card2: #2c2c2e;
    --border: #2c2c2e;
    --text: #f5f5f7;
    --muted: #98989d;
    --green: #30d158;
    --red: #ff453a;
    --amber: #ffd60a;
    --blue: #0a84ff;
    --purple: #bf5af2;
  }
  .flotte { display: flex; gap: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch;
            background: #161618; border-radius: 14px; padding: 4px; margin-bottom: 16px; scrollbar-width: none; }
  .flotte::-webkit-scrollbar { display: none; }
  .flotte a { white-space: nowrap; padding: 9px 13px; border-radius: 10px; color: var(--muted);
              text-decoration: none; font-size: 13px; font-weight: 600; }
  .flotte a.active { background: #2f2f31; color: var(--text); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    padding: calc(24px + env(safe-area-inset-top, 0px))
             calc(16px + env(safe-area-inset-right, 0px))
             calc(60px + env(safe-area-inset-bottom, 0px))
             calc(16px + env(safe-area-inset-left, 0px));
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 { font-size: 1.7rem; margin-bottom: 6px; }
  h1 .tag {
    font-size: 0.75rem; vertical-align: middle; margin-left: 10px;
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 10px; color: var(--muted); font-weight: 500;
  }
  .sub { color: var(--muted); font-size: 0.92rem; }
  .sub a { color: var(--blue); text-decoration: none; }
  .sub a:hover { text-decoration: underline; }

  .review {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; margin-bottom: 26px; overflow: hidden;
  }
  .review-head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--card2);
  }
  .review-head .datum { font-size: 1.1rem; font-weight: 600; }
  .review-head .slot {
    font-size: 0.75rem; background: rgba(88,166,255,.15); color: var(--blue);
    border-radius: 999px; padding: 2px 10px;
  }
  .review-head .zeit { color: var(--muted); font-size: 0.85rem; margin-left: auto; }

  .cols { display: block; }
  .col { padding: 18px 20px; }

  .col h3 { font-size: 1rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .col h3 a { color: inherit; text-decoration: none; }
  .col h3 a:hover { text-decoration: underline; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot.haupt { background: var(--blue); }
  .dot.speku { background: var(--purple); }

  .kpis { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 12px; }
  .kpi .v { font-size: 1.15rem; font-weight: 700; }
  .kpi .l { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .pos { color: var(--green); } .neg { color: var(--red); }

  .score { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .score-bar { flex: 1; height: 8px; background: var(--card2); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
  .score-fill { height: 100%; border-radius: 999px; }
  .score-num { font-weight: 700; font-size: 0.9rem; min-width: 44px; text-align: right; }

  .fazit { font-size: 0.92rem; margin-bottom: 12px; padding: 10px 12px; background: var(--card2); border-radius: 8px; border-left: 3px solid var(--border); }
  .punkte { list-style: none; }
  .punkte li { font-size: 0.88rem; color: var(--muted); padding: 5px 0 5px 18px; position: relative; }
  .punkte li::before { content: "›"; position: absolute; left: 4px; color: var(--blue); }

  .vergleich, .lektionen { padding: 16px 20px; border-top: 1px solid var(--border); }
  .vergleich h4, .lektionen h4 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
  .vergleich p { font-size: 0.92rem; }
  .lektionen { background: rgba(210,153,34,.06); }
  .lektionen ul { list-style: none; }
  .lektionen li { font-size: 0.9rem; padding: 4px 0 4px 22px; position: relative; }
  .lektionen li::before { content: "⚠"; position: absolute; left: 0; color: var(--amber); }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 30px; }

  /* iPhone (16 Pro Max: 440pt) */
  @media (max-width: 500px) {
    body { padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
    h1 { font-size: 1.35rem; }
    h1 .tag { display: block; width: max-content; margin: 8px 0 0; }
    .sub { font-size: 0.88rem; }
    .sub a { display: inline-block; padding: 4px 0; }
    .review-head { padding: 12px 14px; gap: 8px; }
    .review-head .zeit { margin-left: 0; width: 100%; }
    .col { padding: 14px; }
    .kpis { gap: 12px; }
    .kpi .v { font-size: 1.05rem; }
    .fazit, .punkte li { font-size: 0.9rem; }
    .vergleich, .lektionen { padding: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="flotten-nav" data-active="reviews"></div>
<script src="https://cedriceckert85-wq.github.io/review/nav.js" defer></script>
  <header>
    <h1>EPMT Review <span class="tag">2× täglich · 17:00 &amp; 22:00</span></h1>
    <p class="sub">Unabhängige Experten-Bewertung der Trader-Flotte — alle Agenten über die Leiste oben erreichbar.</p>
  </header>
  <div id="agentwahl-box" style="margin:0 0 18px"></div>
  <div id="reviews"><p class="empty">Lade Bewertungen…</p></div>
  <footer>Automatisch erstellt · Bewertungen sind keine Anlageberatung</footer>
</div>

<script>
function fmtEur(v) {
  return v.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
}
function fmtPct(v) {
  const s = v > 0 ? "+" : "";
  return s + v.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " %";
}
function scoreColor(s) {
  if (s >= 8) return "var(--green)";
  if (s >= 5) return "var(--amber)";
  return "var(--red)";
}
// Die 6 Agenten (Reihenfolge = Dropdown-Reihenfolge). link = Detailseite agent.html.
const AGENTEN = [
  { key: "haupt",    name: "📊 Haupt-Depot",    farbe: "#0a84ff" },
  { key: "speku",    name: "🚀 Speku-Depot",    farbe: "#bf5af2" },
  { key: "schatten", name: "👤 Schatten-Depot", farbe: "#64d2ff" },
  { key: "swing",    name: "◆ Gegentrend",           farbe: "#5ac8fa" },
  { key: "solid",    name: "🤍 SOLID",          farbe: "#a5d6ff" },
  { key: "risk",     name: "🔥 RISK",           farbe: "#ff7b54" },
];
const AGENT_BY = Object.fromEntries(AGENTEN.map(a => [a.key, a]));

function depotCol(d, name, farbe, link) {
  d = d || {};
  const dot = `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${farbe};margin-right:6px;vertical-align:middle"></span>`;
  const rend = (typeof d.rendite === "number") ? fmtPct(d.rendite) : "—";
  const cls2 = (typeof d.rendite === "number" && d.rendite < 0) ? "neg" : "pos";
  const verm = (typeof d.vermoegen === "number") ? fmtEur(d.vermoegen) : (d.vermoegen || "—");
  const cash = (typeof d.cashQuote === "number") ? d.cashQuote.toLocaleString("de-DE") + " %" : "—";
  const score = (typeof d.score === "number") ? d.score : null;
  return `
  <div class="col">
    <h3>${dot}<a href="${link}" target="_blank">${name}</a></h3>
    <div class="kpis">
      <div class="kpi"><div class="v">${verm}</div><div class="l">Vermögen</div></div>
      <div class="kpi"><div class="v ${cls2}">${rend}</div><div class="l">Rendite</div></div>
      <div class="kpi"><div class="v">${cash}</div><div class="l">Cash</div></div>
    </div>
    ${score != null ? `<div class="score">
      <div class="score-bar"><div class="score-fill" style="width:${score * 10}%; background:${scoreColor(score)}"></div></div>
      <div class="score-num">${score}/10</div>
    </div>` : ""}
    ${d.fazit ? `<div class="fazit">${d.fazit}</div>` : ""}
    ${(d.punkte && d.punkte.length) ? `<ul class="punkte">${d.punkte.map(p => `<li>${p}</li>`).join("")}</ul>` : ""}
  </div>`;
}

function kopf(r) {
  return `<div class="review-head"><span class="datum">${r.datum}</span><span class="slot">${r.slot}</span><span class="zeit">${r.zeit} Uhr</span></div>`;
}

let REVIEWS = [];
function render(sel) {
  const el = document.getElementById("reviews");
  const reviews = [...REVIEWS].reverse();
  if (!reviews.length) { el.innerHTML = '<p class="empty">Noch keine Bewertungen.</p>'; return; }

  const ag = AGENT_BY[sel];
  const mit = reviews.filter(r => r[sel]);
  if (!mit.length) {
    el.innerHTML = `<p class="empty">Noch kein eigenes Review für ${ag.name}.<br>
      Der Reviewer ergänzt das in den kommenden Läufen (17:00 / 22:00).</p>`;
    return;
  }
  el.innerHTML = mit.map(r => `
    <article class="review">
      ${kopf(r)}
      <div class="cols">${depotCol(r[sel], ag.name, ag.farbe, "agent.html?a=" + sel)}</div>
    </article>`).join("");
}

// Dropdown aufbauen
(function () {
  const box = document.getElementById("agentwahl-box");
  box.innerHTML = `<label style="display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)">Review wählen:
    <select id="agentwahl" style="flex:0 1 auto;padding:8px 12px;border-radius:10px;background:var(--card2,#1c1c1e);color:inherit;border:1px solid var(--border);font-size:.95rem">
      ${AGENTEN.map(a => `<option value="${a.key}">${a.name} – Review</option>`).join("")}
    </select></label>`;
  const dd = document.getElementById("agentwahl");
  const valid = AGENTEN.map(a => a.key);
  let start = (location.hash || "").replace("#", "");
  if (!valid.includes(start)) start = "haupt";
  dd.value = start;
  dd.addEventListener("change", () => { location.hash = dd.value; render(dd.value); });
  window.addEventListener("hashchange", () => {
    let v = (location.hash || "").replace("#", "");
    if (!valid.includes(v)) v = "haupt";
    if (dd.value !== v) dd.value = v;
    render(v);
  });

  fetch("data/reviews.json?_=" + Date.now())
    .then(r => r.json())
    .then(data => { REVIEWS = data.reviews || []; render(dd.value); })
    .catch(() => {
      document.getElementById("reviews").innerHTML = '<p class="empty">Bewertungen konnten nicht geladen werden.</p>';
    });
})();
</script>
</body>
</html>
