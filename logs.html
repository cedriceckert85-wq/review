<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flotten-Log">
<title>📜 Flotten-Log — alle Agenten in einem Strom</title>
<style>
  :root { --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --border:#2c2c2e; --text:#f5f5f7; --muted:#98989d;
          --green:#30d158; --blue:#0a84ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; }
  body { background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
         -webkit-font-smoothing:antialiased; line-height:1.5;
         padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px)); }
  .wrap { max-width:1000px; margin:0 auto; }
  .flotte { display:flex; gap:4px; overflow-x:auto; -webkit-overflow-scrolling:touch;
            background:#161618; border-radius:14px; padding:4px; margin-bottom:16px; scrollbar-width:none; }
  .flotte::-webkit-scrollbar { display:none; }
  .flotte a { white-space:nowrap; padding:9px 13px; border-radius:10px; color:var(--muted);
              text-decoration:none; font-size:13px; font-weight:600; }
  .flotte a.active { background:#2f2f31; color:var(--text); }
  h1 { font-size:1.4rem; margin-bottom:4px; }
  .sub { color:var(--muted); font-size:0.86rem; margin-bottom:14px; }
  .filter { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .f-btn { background:var(--card); border:1px solid var(--border); color:var(--muted); border-radius:999px;
           padding:6px 13px; font-size:0.8rem; font-weight:600; cursor:pointer; font-family:inherit; }
  .f-btn.aktiv { color:var(--text); border-color:var(--blue); }
  .eintrag { background:var(--card); border-radius:14px; padding:11px 14px; margin-bottom:8px;
             border-left:3px solid var(--c, var(--border)); }
  .kopf { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .agent { font-weight:700; font-size:0.85rem; }
  .zeit { color:var(--muted); font-size:0.74rem; margin-left:auto; font-variant-numeric:tabular-nums; }
  .text { font-size:0.9rem; margin-top:2px; }
  .leer { text-align:center; color:var(--muted); padding:50px 10px; }
  footer { text-align:center; color:var(--muted); font-size:0.76rem; margin-top:20px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="flotten-nav" data-active="logs"></div>
<script src="https://cedriceckert85-wq.github.io/review/nav.js" defer></script>
  <h1>📜 Flotten-Log</h1>
  <p class="sub">Alle Agenten-Aktivitäten in einem Strom — neueste zuerst, aktualisiert sich jede Minute. <span id="stand" style="color:var(--green); font-weight:600;"></span><br>Volle Denkprotokolle der Läufe: <a href="https://claude.ai/code/routines" style="color:var(--blue); text-decoration:none;">claude.ai/code → Routines</a></p>
  <div class="filter" id="filter"></div>
  <div id="feed"><p class="leer">Lade…</p></div>
  <footer>Quelle: Commit-Aktivität aller Flotten-Repos · Keine Anlageberatung</footer>
</div>

<script>
const FARBEN = { haupt:"#0a84ff", speku:"#bf5af2", schatten:"#64d2ff", swing:"#ffd60a",
                 solid:"#f5f5f7", risk:"#ff9f0a", bots:"#ff9f0a", system:"#98989d" };
let alleEintraege = [], aktiverFilter = "alle";

function zeigen() {
  const feed = document.getElementById("feed");
  const liste = aktiverFilter === "alle" ? alleEintraege
    : alleEintraege.filter(e => e.agent === aktiverFilter || (aktiverFilter === "bots" && ["solid","risk","bots"].includes(e.agent)));
  feed.innerHTML = liste.length ? liste.map(e => {
    const d = new Date(e.zeit);
    const zeit = d.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit"}) + " " +
                 d.toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"});
    return `<div class="eintrag" style="--c:${FARBEN[e.agent] || "#444"}">
      <div class="kopf"><span class="agent">${e.label}</span><span class="zeit">${zeit}</span></div>
      <div class="text">${e.text}</div></div>`;
  }).join("") : '<p class="leer">Keine Einträge für diesen Filter.</p>';
}

function filterBauen() {
  const optionen = [["alle","Alle"],["haupt","📊"],["speku","🚀"],["schatten","👤"],["swing","◆"],["bots","🤍🔥"],["system","🛠"]];
  document.getElementById("filter").innerHTML = optionen.map(([k, t]) =>
    `<button class="f-btn ${aktiverFilter === k ? "aktiv" : ""}" onclick="aktiverFilter='${k}';filterBauen();zeigen()">${t}</button>`).join("");
}

function laden() {
  fetch("https://raw.githubusercontent.com/cedriceckert85-wq/review/live/data/feed.json?_=" + Date.now())
    .then(r => r.ok ? r.json() : Promise.reject())
    .catch(() => fetch("data/feed.json?_=" + Date.now()).then(r => r.json()))
    .then(d => {
      alleEintraege = d.eintraege || [];
      if (d.standUtc) {
        const s = new Date(d.standUtc);
        document.getElementById("stand").textContent = "● Stand " + s.toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"});
      }
      filterBauen();
      zeigen();
    })
    .catch(() => { document.getElementById("feed").innerHTML = '<p class="leer">Feed noch nicht verfügbar — der erste Sammellauf kommt in wenigen Minuten.</p>'; });
}
laden();
setInterval(laden, 60 * 1000);
</script>
</body>
</html>
