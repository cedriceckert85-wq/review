<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Agent — EPMT-Flotte</title>
<style>
  :root { --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --txt:#f5f5f7; --dim:#98989d; --line:#2c2c2e;
          --up:#30d158; --down:#ff453a; --blue:#0a84ff; --amber:#ffd60a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    padding:max(16px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1000px; margin:0 auto; }
  @media (min-width: 761px) {
    .compare { grid-template-columns:repeat(3, minmax(140px, 220px)); justify-content:center; }
  }
  .flotte { display:flex; gap:4px; overflow-x:auto; -webkit-overflow-scrolling:touch;
            background:#161618; border-radius:14px; padding:4px; margin-bottom:8px; scrollbar-width:none; }
  .flotte::-webkit-scrollbar { display:none; }
  .flotte a { white-space:nowrap; padding:9px 13px; border-radius:10px; color:var(--dim);
              text-decoration:none; font-size:13px; font-weight:600; }
  .flotte a.active { background:#2f2f31; color:var(--txt); }
  .hero { text-align:center; padding:24px 0 8px; }
  .hero .label { font-size:15px; color:var(--dim); font-weight:500; }
  .hero .big { font-size:46px; font-weight:700; letter-spacing:-1px; margin:2px 0; font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; font-size:15px; font-weight:600; padding:3px 12px; border-radius:999px; }
  .pill.up { background:rgba(48,209,88,.15); color:var(--up); }
  .pill.down { background:rgba(255,69,58,.15); color:var(--down); }
  .stamp { font-size:12px; color:var(--dim); margin-top:8px; }
  .compare { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:20px 0; }
  .chip { background:var(--card); border-radius:16px; padding:12px 10px; text-align:center; }
  .chip .t { font-size:11px; color:var(--dim); font-weight:500; }
  .chip .v { font-size:17px; font-weight:600; margin-top:2px; font-variant-numeric:tabular-nums; }
  .up { color:var(--up); } .down { color:var(--down); }
  h2 { font-size:20px; font-weight:700; letter-spacing:-.3px; margin:28px 4px 10px; }
  .card { background:var(--card); border-radius:18px; overflow:hidden; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px;
         padding:13px 16px; border-bottom:.5px solid var(--line); font-size:15px; }
  .row:last-child { border-bottom:none; }
  .tk { font-weight:600; }
  .dim { color:var(--dim); font-size:13px; margin-top:1px; }
  .right { text-align:right; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .res { font-weight:600; font-size:13px; }
  .badge { font-size:11px; font-weight:600; padding:1px 8px; border-radius:999px; vertical-align:1px; }
  .badge.buy { background:rgba(10,132,255,.12); color:var(--blue); }
  .badge.sell { background:rgba(255,149,0,.15); color:#ff9500; }
  .badge.win { background:rgba(48,209,88,.15); color:var(--up); }
  .badge.loss { background:rgba(255,69,58,.15); color:var(--down); }
  .badge.wait { background:rgba(152,152,157,.15); color:var(--dim); }
  .leer { padding:18px 16px; color:var(--dim); font-size:14px; }
  .notiz { padding:13px 16px; font-size:14px; color:var(--dim); line-height:1.5; }
  .note { font-size:12px; color:var(--dim); line-height:1.5; margin:28px 8px 0; text-align:center; }
  .note a { color:var(--blue); text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <div id="flotten-nav"></div>
  <script src="https://cedriceckert85-wq.github.io/review/nav.js" defer></script>
  <div class="hero">
    <div class="label" id="agent-name">…</div>
    <div class="big" id="vermoegen">—</div>
    <span class="pill up" id="rendite">—</span>
    <div class="stamp" id="stamp"></div>
  </div>
  <div class="compare" id="chips"></div>
  <h2>Performance <span style="font-weight:400;font-size:13px;color:var(--dim)">seit 12.06. — vs. S&amp;P 500 &amp; Tagesgeld 2 %</span></h2>
  <div class="card" style="padding:14px 14px 10px;">
    <canvas id="chart" style="width:100%;height:240px;display:block;"></canvas>
    <div id="legende" style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--dim);"></div>
  </div>
  <h2 id="konz-titel" style="display:none">Themen-Konzentration <span style="font-weight:400;font-size:13px;color:var(--dim)">(Kennzahl, keine Regel)</span></h2>
  <div class="card" id="konz" style="display:none"></div>
  <h2>Offene Positionen</h2>
  <div class="card" id="positionen"><div class="leer">Lade…</div></div>
  <h2>Trades</h2>
  <div class="card" id="trades"><div class="leer">Lade…</div></div>
  <h2 id="notiz-titel" style="display:none">Letzter Lauf</h2>
  <div class="card" id="notiz" style="display:none"></div>
  <p class="note">Paper-Trading · Keine Anlageberatung · <a id="details" href="#">Detail-Ansicht öffnen</a></p>
</div>

<script>
const fmtUsd = v => v.toLocaleString("de-DE", {maximumFractionDigits: 0}) + " $";
const fmtEur = v => v.toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";
const fmtPct = v => (v > 0 ? "+" : "") + v.toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " %";
const fmtR = v => (v > 0 ? "+" : "") + v.toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " R";
const dd = s => s && s.includes("-") ? s.slice(8, 10) + "." + s.slice(5, 7) + "." : (s || "");

const BASIS = "https://cedriceckert85-wq.github.io";

const THEMEN = {
  "Quantum": ["QBTS", "IONQ", "RGTI", "QUBT"],
  "KI / Chips": ["NVDA", "AMD", "AVGO", "MU", "INTC", "AMAT", "LRCX", "KLAC", "TSM", "ARM", "SMCI"],
  "Energie / Nuklear": ["CEG", "VST", "OKLO", "SMR", "NEE", "DUK", "SO", "XLE", "USO", "COP", "EOG", "SLB"],
  "Space": ["RKLB", "UFO", "SPCX", "LUNR", "ASTS"],
  "Hebel-Index": ["TQQQ", "SQQQ", "UPRO", "SPXL"],
  "Index / Breite": ["SPY", "QQQ", "IWM", "DIA"],
  "IT-Hardware": ["HPE", "DELL", "IBM", "CSCO", "ANET"],
};
function themaVon(ticker) {
  for (const [thema, liste] of Object.entries(THEMEN)) {
    if (liste.includes(ticker)) return thema;
  }
  return "Sonstiges";
}
function konzentrationZeigen(betraege, waehrung, gesamtwert) {
  const titel = document.getElementById("konz-titel");
  const karte = document.getElementById("konz");
  const investiert = betraege.reduce((s, p) => s + p.betrag, 0);
  if (!investiert) { titel.style.display = "none"; karte.style.display = "none"; return; }
  const gesamt = (gesamtwert && gesamtwert > investiert) ? gesamtwert : investiert;
  const proThema = {};
  betraege.forEach(p => { const t = themaVon(p.ticker); proThema[t] = (proThema[t] || 0) + p.betrag; });
  const sortiert = Object.entries(proThema).sort((a, b) => b[1] - a[1]);
  // Hauptzahl = Anteil am Gesamtvermoegen; Klumpen-Warnung bleibt auf dem investierten Anteil.
  let html = sortiert.map(([thema, betrag]) => {
    const pct = betrag / gesamt * 100;
    const investPct = betrag / investiert * 100;
    const warn = investPct >= 60 ? ' <span class="badge loss">⚠️ Klumpen</span>' : investPct >= 40 ? ' <span class="badge wait">erhöht</span>' : "";
    return `<div class="row">
      <div><span class="tk">${thema}</span>${warn}</div>
      <div class="right"><div class="res">${Math.round(betrag).toLocaleString("de-DE")} ${waehrung} · ${pct.toFixed(0)} %</div>
      <div class="dim">vom Gesamtwert (${investPct.toFixed(0)} % des Investierten)</div></div></div>`;
  }).join("");
  const cash = gesamt - investiert;
  if (cash > 0.5) {
    html += `<div class="row">
      <div><span class="tk">Cash</span></div>
      <div class="right"><div class="res">${Math.round(cash).toLocaleString("de-DE")} ${waehrung} · ${(cash / gesamt * 100).toFixed(0)} %</div>
      <div class="dim">vom Gesamtwert</div></div></div>`;
  }
  karte.innerHTML = html;
  titel.style.display = "";
  karte.style.display = "";
}

function journalModell(d, risikoUsd, notiz) {
  const equity = 100000 + (d.statistik.summeR || 0) * risikoUsd;
  const offen = d.trades.filter(t => t.status === "offen" || t.status === "wartet");
  const betraege = offen.filter(t => t.status === "offen").map(t => ({
    ticker: t.ticker,
    betrag: (t.alpaca ? t.alpaca.qty : Math.max(1, Math.floor(risikoUsd / Math.abs(t.entry - t.stop)))) * (t.entryFill || t.entry),
  }));
  const fertig = d.trades.filter(t => !["offen", "wartet"].includes(t.status));
  const investiert = betraege.reduce((s, p) => s + p.betrag, 0);
  const realisiert = (d.statistik.summeR || 0) * risikoUsd;
  const st = d.statistik;
  return {
    vermoegen: fmtUsd(equity),
    rendite: (equity / 100000 - 1) * 100,
    stand: d.konto.status + " · 1R = " + risikoUsd.toLocaleString("de-DE") + " $" + (st.bremseAktiv ? " · ⛔ Verlustserien-Bremse" : ""),
    chips: [
      { t: "Cash", v: ((equity - investiert) / equity * 100).toLocaleString("de-DE", {maximumFractionDigits: 1}) + " %" },
      { t: "Realisiert", v: (realisiert > 0 ? "+" : "") + Math.round(realisiert).toLocaleString("de-DE") + " $", cls: realisiert > 0 ? "up" : realisiert < 0 ? "down" : "" },
      { t: "Trefferquote", v: st.trefferquote == null ? "— (0 Trades)" : st.trefferquote.toLocaleString("de-DE") + " % (" + st.gewonnen + "/" + st.trades + ")", cls: st.trefferquote >= 50 ? "up" : st.trefferquote == null ? "" : "down" },
    ],
    positionen: offen.map(t => ({
      tk: t.ticker, sub: `${t.id}${t.engine ? " · " + t.engine : ""} · Entry ${t.entryFill || t.entry} · Stop ${t.stop} · Ziel ${t.tp}`,
      badge: t.status === "wartet" ? ["wait", "wartet"] : ["buy", t.richtung],
      rechts: t.alpaca ? t.alpaca.qty + " Stk." : "—", rsub: t.status === "offen" ? "seit " + dd(t.entryDatum) : "Order liegt",
    })),
    trades: [...d.trades].reverse().map(t => ({
      tk: t.ticker, sub: `${dd(t.datumEmpfehlung)} ${t.id}${t.engine ? " · " + t.engine : ""} · ${t.entryTyp || ""} ${t.entry} → ${t.status === "gewonnen" ? "Ziel " + t.tp : t.status === "verloren" ? "Stop " + t.stop : "Ziel " + t.tp + " / Stop " + t.stop}`,
      badge: t.status === "gewonnen" ? ["win", "gewonnen"] : t.status === "verloren" ? ["loss", "verloren"] : ["wait", t.status.replace("_", "-")],
      rechts: t.ergebnisR != null ? fmtR(t.ergebnisR) : "—",
      rcls: t.ergebnisR > 0 ? "up" : t.ergebnisR < 0 ? "down" : "",
      rsub: t.pnlEur != null ? t.pnlEur.toLocaleString("de-DE") + " $" : "",
    })),
    notiz,
    betraege, waehrung: "$", gesamtwert: equity,
  };
}

async function depotModell(seite, detailUrl) {
  let d;
  try {
    const html = await (await fetch(seite + "?_=" + Date.now())).text();
    const m = html.match(/<script type="application\/json" id="agent-daten">([\s\S]*?)<\/script>/);
    if (!m) throw new Error("kein Datenblock im Dashboard");
    d = JSON.parse(m[1]);
  } catch (e) {
    // Robust: fehlt der Datenblock (z.B. veraltetes Dashboard), nicht hart scheitern,
    // sondern sauber degradieren statt "Daten nicht ladbar".
    return {
      vermoegen: "—", rendite: 0,
      stand: "Detaildaten erscheinen nach dem nächsten Depot-Lauf",
      chips: [],
      positionen: [],
      trades: [],
      notiz: 'Die strukturierten Daten dieses Depots sind im veröffentlichten Dashboard gerade nicht eingebettet ('
        + (e.message || "Ladefehler") + '). Vollansicht: <a href="' + seite
        + '" target="_blank" style="color:inherit;text-decoration:underline">Dashboard direkt öffnen</a>.',
      betraege: [], waehrung: "€", gesamtwert: 0,
    };
  }
  const verkaeufe = d.trades.filter(t => t.aktion === "Verkauf" && (t.ergebnis || "") !== "");
  const gewonnen = verkaeufe.filter(t => (t.ergebnis || "").startsWith("+")).length;
  return {
    vermoegen: fmtEur(d.vermoegen), rendite: d.rendite, stand: d.stand + " · vs. SPY: " + fmtPct(d.vsSpyPp).replace(" %", " pp"),
    chips: [
      { t: "Cash", v: d.cashQuote.toLocaleString("de-DE") + " %" },
      { t: "Realisiert", v: (d.realisiert > 0 ? "+" : "") + d.realisiert.toLocaleString("de-DE", {minimumFractionDigits: 2}) + " €", cls: d.realisiert > 0 ? "up" : d.realisiert < 0 ? "down" : "" },
      { t: "Trefferquote", v: verkaeufe.length === 0 ? "— (0 Trades)" : Math.round(gewonnen / verkaeufe.length * 100) + " % (" + gewonnen + "/" + verkaeufe.length + ")", cls: verkaeufe.length === 0 ? "" : (gewonnen / verkaeufe.length >= 0.5 ? "up" : "down") },
    ],
    positionen: d.positionen.map(p => {
      const kurs = p.kurs || p.entry;
      let plPct = (kurs / p.entry - 1) * 100;
      if (p.side === "short") plPct = -plPct;
      return {
        tk: p.ticker, sub: `${p.eur.toLocaleString("de-DE")} € · Einstieg ${p.entry} · Stop ${p.stop} · Ziel ${p.ziel} · max ${p.maxTage} Tage`,
        badge: p.side === "short" ? ["sell", "short"] : p.speku ? ["wait", "speku"] : ["buy", "long"],
        rechts: fmtPct(plPct), rcls: plPct > 0 ? "up" : plPct < 0 ? "down" : "",
        rsub: "Kurs " + kurs.toLocaleString("de-DE"),
      };
    }),
    trades: d.trades.map(t => ({
      tk: t.ticker, sub: `${(t.zeit || "").slice(0, 16).replace("T", " ")} · ${t.info || ""}${t.grund ? " · " + t.grund : ""}`,
      badge: t.aktion === "Kauf" ? ["buy", "Kauf"] : ["sell", t.aktion],
      rechts: typeof t.preis === "number" ? t.preis.toLocaleString("de-DE") : (t.preis || "—"),
      rcls: (t.ergebnis || "").startsWith("+") ? "up" : (t.ergebnis || "").startsWith("-") ? "down" : "",
      rsub: t.ergebnis || "",
    })),
    notiz: null,
    betraege: d.positionen.map(p => ({ ticker: p.ticker, betrag: p.eur })),
    waehrung: "€", gesamtwert: d.vermoegen,
  };
}

const AGENTEN = {
  haupt: {
    name: "📊 Haupt-Depot (Regel-Trader)",
    details: BASIS + "/epmt-dashboard/index.html",
    laden: () => depotModell(BASIS + "/epmt-dashboard/index.html"),
  },
  speku: {
    name: "🚀 Speku-Depot (Zukunfts-Mandat)",
    details: BASIS + "/epmt-dashboard/speku.html",
    laden: () => depotModell(BASIS + "/epmt-dashboard/speku.html"),
  },
  schatten: {
    name: "👤 Schatten-Depot (Reviewer)",
    details: "schatten.html",
    laden: async () => {
      const d = await (await fetch(BASIS + "/review/data/schatten.json?_=" + Date.now())).json();
      const unrealisiert = d.positionen.reduce((s, p) => s + p.einsatz * p.rendite / 100, 0);
      const realisiert = (d.aktuell.vermoegen - d.meta.startKapital) - unrealisiert;
      const verkaeufe = d.trades.filter(t => t.aktion !== "Kauf");
      return {
        vermoegen: fmtEur(d.aktuell.vermoegen), rendite: d.aktuell.rendite, stand: d.aktuell.stand + " · Calls: " + d.scoreboard.richtig + " richtig / " + d.scoreboard.falsch + " falsch / " + d.scoreboard.offen + " offen",
        chips: [
          { t: "Cash", v: d.aktuell.cashQuote.toLocaleString("de-DE") + " %" },
          { t: "Realisiert", v: (realisiert > 0 ? "+" : "") + realisiert.toLocaleString("de-DE", {maximumFractionDigits: 2}) + " €", cls: realisiert > 0.005 ? "up" : realisiert < -0.005 ? "down" : "" },
          { t: "Trefferquote", v: verkaeufe.length === 0 ? "— (0 Trades)" : "siehe Calls" },
        ],
        positionen: d.positionen.map(p => ({
          tk: p.ticker, sub: `${fmtEur(p.einsatz)} · Einstand ${p.einstand} · Stop ${p.stop} · Ziel ${p.ziel}`,
          badge: p.stopVerletzt ? ["loss", "STOP!"] : ["buy", "long"],
          rechts: fmtPct(p.rendite), rcls: p.rendite > 0 ? "up" : p.rendite < 0 ? "down" : "",
          rsub: "Kurs " + p.kurs.toLocaleString("de-DE"),
        })),
        trades: [...d.trades].reverse().map(t => ({
          tk: t.ticker, sub: `${t.datum} ${t.zeit || ""} · ${t.kommentar || ""}`,
          badge: t.aktion === "Kauf" ? ["buy", "Kauf"] : ["sell", t.aktion],
          rechts: t.kurs.toLocaleString("de-DE"), rsub: fmtEur(t.einsatz),
        })),
        notiz: null,
        betraege: d.positionen.map(p => ({ ticker: p.ticker, betrag: p.einsatz })),
        waehrung: "€", gesamtwert: d.aktuell.vermoegen,
      };
    },
  },
  swing: {
    name: "◆ Elite Swing Agent",
    details: BASIS + "/swing/",
    laden: async () => {
      const [j, e] = await Promise.all([
        (await fetch(BASIS + "/swing/data/journal.json?_=" + Date.now())).json(),
        fetch(BASIS + "/swing/data/empfehlungen.json?_=" + Date.now()).then(r => r.json()).catch(() => null),
      ]);
      const letzter = e && e.laeufe.length ? e.laeufe[e.laeufe.length - 1] : null;
      return journalModell(j, 1000, letzter
        ? `${letzter.datum}: ${letzter.empfehlung && letzter.empfehlung.trade ? "TRADE → " + letzter.empfehlung.tradeId : "KEIN TRADE"} — ${letzter.empfehlung ? letzter.empfehlung.begruendung : ""}`
        : null);
    },
  },
  solid: {
    name: "🤍 SOLID — Evidenz-Bot",
    details: BASIS + "/bots/",
    laden: async () => {
      const j = await (await fetch(BASIS + "/bots/data/solid_journal.json?_=" + Date.now())).json();
      return journalModell(j, 1000, j.konto.hinweisLetzterLauf || null);
    },
  },
  risk: {
    name: "🔥 RISK — Gewinn-Jäger",
    details: BASIS + "/bots/",
    laden: async () => {
      const j = await (await fetch(BASIS + "/bots/data/risk_journal.json?_=" + Date.now())).json();
      return journalModell(j, 2000, j.konto.hinweisLetzterLauf || null);
    },
  },
};

const key = new URLSearchParams(location.search).get("a") || "schatten";
const cfg = AGENTEN[key] || AGENTEN.schatten;

document.getElementById("flotten-nav").dataset.active = key;

const AGENT_FARBEN = { haupt: "#0a84ff", speku: "#bf5af2", schatten: "#64d2ff",
                       swing: "#ffd60a", solid: "#f5f5f7", risk: "#ff9f0a" };
let chartDaten = [];

function chartZeichnen() {
  const cv = document.getElementById("chart");
  if (!cv || !chartDaten.length) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight || 240;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  const serien = [
    { k: key, farbe: AGENT_FARBEN[key] || "#f5f5f7", breite: 2.5, dash: [] },
    { k: "spy", farbe: "#8e8e93", breite: 1.5, dash: [6, 4] },
    { k: "tagesgeld", farbe: "#30d158", breite: 1.5, dash: [2, 4] },
  ];
  const werte = chartDaten.flatMap(p => serien.map(s => p[s.k]).filter(v => v != null));
  let min = Math.min(...werte, 0), max = Math.max(...werte, 0);
  const span = Math.max(max - min, 0.4);
  min -= span * 0.15; max += span * 0.15;
  const padL = 44, padR = 10, padT = 10, padB = 24;
  const x = i => chartDaten.length === 1 ? (padL + (W - padL - padR) / 2)
    : padL + (W - padL - padR) * i / (chartDaten.length - 1);
  const y = v => padT + (H - padT - padB) * (1 - (v - min) / (max - min));
  ctx.font = "10px -apple-system,sans-serif";
  for (let i = 0; i <= 4; i++) {
    const v = min + (max - min) * i / 4;
    ctx.strokeStyle = "#2c2c2e"; ctx.beginPath();
    ctx.moveTo(padL, y(v)); ctx.lineTo(W - padR, y(v)); ctx.stroke();
    ctx.fillStyle = "#98989d"; ctx.textAlign = "right";
    ctx.fillText(v.toFixed(1) + "%", padL - 5, y(v) + 3);
  }
  ctx.strokeStyle = "#48484a"; ctx.setLineDash([4, 4]); ctx.beginPath();
  ctx.moveTo(padL, y(0)); ctx.lineTo(W - padR, y(0)); ctx.stroke(); ctx.setLineDash([]);
  const step = Math.max(1, Math.ceil(chartDaten.length / 7));
  ctx.fillStyle = "#98989d"; ctx.textAlign = "center";
  chartDaten.forEach((p, i) => {
    if (i % step === 0 || i === chartDaten.length - 1) ctx.fillText(p.label, x(i), H - 6);
  });
  serien.forEach(s => {
    ctx.strokeStyle = s.farbe; ctx.lineWidth = s.breite; ctx.setLineDash(s.dash);
    ctx.beginPath();
    let begonnen = false;
    chartDaten.forEach((p, i) => {
      if (p[s.k] == null) return;
      if (!begonnen) { ctx.moveTo(x(i), y(p[s.k])); begonnen = true; }
      else ctx.lineTo(x(i), y(p[s.k]));
    });
    ctx.stroke(); ctx.setLineDash([]);
    chartDaten.forEach((p, i) => {
      if (p[s.k] == null) return;
      ctx.fillStyle = s.farbe; ctx.beginPath();
      ctx.arc(x(i), y(p[s.k]), s.breite + 0.5, 0, Math.PI * 2); ctx.fill();
    });
  });
  const namen = { haupt: "Haupt-Depot", speku: "Speku-Depot", schatten: "Schatten", swing: "Swing", solid: "SOLID", risk: "RISK" };
  document.getElementById("legende").innerHTML =
    `<span style="color:${AGENT_FARBEN[key]}">●</span> ${namen[key] || key} &nbsp;` +
    `<span style="color:#8e8e93">◌</span> S&P 500 &nbsp;` +
    `<span style="color:#30d158">●</span> Tagesgeld 2 %`;
}

function chartLaden() {
  Promise.all([
    fetch(BASIS + "/review/data/vergleich.json?_=" + Date.now()).then(r => r.json()),
    fetch("https://raw.githubusercontent.com/cedriceckert85-wq/review/live/data/live.json?_=" + Date.now())
      .then(r => r.ok ? r.json() : null).catch(() => null),
  ]).then(([d, live]) => {
    chartDaten = [...d.verlauf];
    if (live && live.standUhr) {
      const letzter = chartDaten[chartDaten.length - 1];
      if (!letzter || letzter.label !== "live") chartDaten.push({ ...live, label: "live" });
    }
    chartZeichnen();
  }).catch(() => {});
}
chartLaden();
setInterval(chartLaden, 60 * 1000);
window.addEventListener("resize", () => setTimeout(chartZeichnen, 150));

document.title = cfg.name + " — EPMT-Flotte";
document.getElementById("agent-name").textContent = cfg.name;
document.getElementById("details").href = cfg.details;

function zeile(z) {
  return `<div class="row">
    <div><span class="tk">${z.tk}</span> <span class="badge ${z.badge[0]}">${z.badge[1]}</span>
      <div class="dim">${z.sub}</div></div>
    <div class="right"><div class="res ${z.rcls || ""}">${z.rechts}</div><div class="dim">${z.rsub || ""}</div></div>
  </div>`;
}

cfg.laden().then(m => {
  document.getElementById("vermoegen").textContent = m.vermoegen;
  const pill = document.getElementById("rendite");
  pill.textContent = fmtPct(m.rendite);
  pill.className = "pill " + (m.rendite >= 0 ? "up" : "down");
  document.getElementById("stamp").textContent = m.stand;
  document.getElementById("chips").innerHTML = m.chips.map(c =>
    `<div class="chip"><div class="t">${c.t}</div><div class="v ${c.cls || ""}">${c.v}</div></div>`).join("");
  document.getElementById("positionen").innerHTML = m.positionen.length
    ? m.positionen.map(zeile).join("") : '<div class="leer">Keine offenen Positionen.</div>';
  document.getElementById("trades").innerHTML = m.trades.length
    ? m.trades.map(zeile).join("") : '<div class="leer">Noch keine Trades.</div>';
  konzentrationZeigen(m.betraege || [], m.waehrung || "€", m.gesamtwert || 0);
  if (m.notiz) {
    document.getElementById("notiz-titel").style.display = "";
    document.getElementById("notiz").style.display = "";
    document.getElementById("notiz").innerHTML = `<div class="notiz">${m.notiz}</div>`;
  }
}).catch(() => {
  document.getElementById("positionen").innerHTML = '<div class="leer">Daten nicht ladbar.</div>';
});
setInterval(() => location.reload(), 10 * 60 * 1000);
</script>
